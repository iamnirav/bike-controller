<!DOCTYPE html>
<!--
  The bridge's config page. Served by bike_controller/webconfig.py, which is
  the only thing that reads this file, from a path that is a constant.

  Self-contained on purpose: no CDN, no build step, no framework. The Pi has no
  internet guarantee at ride time and this has to work from a phone that just
  joined the wifi.

  The live readout above the dials is not decoration. Tuning the movement floor
  without watching `move` is guesswork -- the number's whole job is to clear a
  deadzone you cannot see, so you need the multiplier and the watts side by side
  while you pedal.
-->
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="dark light">
<title>Bike dials</title>
<style>
  :root {
    --bg: #12141a; --card: #1c1f28; --line: #2c3040;
    --text: #e8eaf0; --dim: #949bb0; --accent: #4ea1ff; --good: #45d17a;
    --warn: #ffb545; --bad: #ff5f56;
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  body {
    margin: 0; background: var(--bg); color: var(--text);
    font: 16px/1.45 system-ui, -apple-system, "Segoe UI", sans-serif;
    padding: 12px 12px calc(28px + env(safe-area-inset-bottom));
    max-width: 640px; margin-inline: auto;
  }
  h1 { font-size: 1.05rem; margin: 4px 0 12px; letter-spacing: .3px; }
  h1 span { color: var(--dim); font-weight: 400; }

  /* --- live readout --- */
  .readout {
    display: grid; grid-template-columns: repeat(4, 1fr); gap: 1px;
    background: var(--line); border: 1px solid var(--line);
    border-radius: 12px; overflow: hidden; margin-bottom: 8px;
  }
  .cell { background: var(--card); padding: 9px 6px; text-align: center; }
  .cell b { display: block; font-size: 1.35rem; font-variant-numeric: tabular-nums; }
  .cell small { color: var(--dim); font-size: .68rem; text-transform: uppercase; letter-spacing: .6px; }
  .link { font-size: .8rem; color: var(--dim); margin: 0 0 16px; padding: 0 2px; }
  .link .dot { display: inline-block; width: 8px; height: 8px; border-radius: 50%;
    background: var(--dim); margin-right: 5px; vertical-align: 1px; }
  .link.ok .dot { background: var(--good); }
  .link.bad .dot { background: var(--bad); }

  /* --- dials --- */
  .dial {
    background: var(--card); border: 1px solid var(--line); border-radius: 12px;
    padding: 12px 14px 6px; margin-bottom: 10px;
  }
  .dial header { display: flex; align-items: baseline; justify-content: space-between; gap: 10px; }
  .dial .name { font-weight: 600; }
  .dial .val { font-variant-numeric: tabular-nums; font-size: 1.3rem; color: var(--accent); }
  .dial .val.off { color: var(--dim); font-size: 1rem; }
  .dial p { color: var(--dim); font-size: .78rem; margin: 6px 0 0; }
  .dial p.note { font-size: .74rem; margin-top: 2px; }
  .dial p.note.pending { color: var(--warn); }
  /* 44px of touch target, which is the number Apple and Google both land on --
     this is operated with a thumb, mid-ride, one-handed. */
  input[type=range] {
    width: 100%; height: 44px; margin: 2px 0 0; background: transparent;
    -webkit-appearance: none; appearance: none;
  }
  input[type=range]::-webkit-slider-runnable-track {
    height: 6px; border-radius: 3px; background: var(--line);
  }
  input[type=range]::-webkit-slider-thumb {
    -webkit-appearance: none; appearance: none; width: 30px; height: 30px;
    border-radius: 50%; background: var(--accent); margin-top: -12px;
    border: 3px solid var(--card);
  }
  input[type=range]::-moz-range-track { height: 6px; border-radius: 3px; background: var(--line); }
  input[type=range]::-moz-range-thumb {
    width: 24px; height: 24px; border: 3px solid var(--card);
    border-radius: 50%; background: var(--accent);
  }
  input[type=range]:disabled::-webkit-slider-thumb { background: var(--dim); }
  input[type=range]:disabled::-moz-range-thumb { background: var(--dim); }

  input.switch {
    -webkit-appearance: none; appearance: none; width: 58px; height: 32px;
    border-radius: 16px; background: var(--line); position: relative;
    margin: 8px 0 2px; transition: background .15s;
  }
  input.switch::after {
    content: ""; position: absolute; top: 3px; left: 3px;
    width: 26px; height: 26px; border-radius: 50%; background: var(--dim);
    transition: transform .15s, background .15s;
  }
  input.switch:checked { background: color-mix(in srgb, var(--accent) 40%, var(--line)); }
  input.switch:checked::after { transform: translateX(26px); background: var(--accent); }

  .toggle { display: flex; align-items: center; gap: 10px; margin-top: 6px; }
  .toggle input { width: 22px; height: 22px; accent-color: var(--accent); }
  .toggle label { font-size: .85rem; color: var(--dim); }

  details { margin-top: 18px; }
  summary {
    cursor: pointer; color: var(--dim); font-size: .85rem; padding: 10px 2px;
    text-transform: uppercase; letter-spacing: .7px;
  }
  button {
    width: 100%; padding: 14px; font: inherit; font-weight: 600;
    background: var(--card); color: var(--warn);
    border: 1px solid var(--warn); border-radius: 12px; margin-top: 6px;
  }
  button:active { background: var(--warn); color: #000; }

  #toast {
    position: fixed; left: 12px; right: 12px;
    bottom: calc(12px + env(safe-area-inset-bottom));
    background: var(--card); border: 1px solid var(--line); color: var(--text);
    border-radius: 10px; padding: 11px 14px; font-size: .85rem;
    opacity: 0; transform: translateY(8px); transition: .18s; pointer-events: none;
    max-width: 616px; margin-inline: auto;
  }
  #toast.show { opacity: 1; transform: none; }
  #toast.err { border-color: var(--bad); color: var(--bad); }
</style>
</head>
<body>

<h1>Bike dials <span id="uptime"></span></h1>

<div class="readout">
  <div class="cell"><b id="r-power">–</b><small>watts</small></div>
  <div class="cell"><b id="r-cadence">–</b><small>rpm</small></div>
  <div class="cell"><b id="r-move">–</b><small>move</small></div>
  <div class="cell"><b id="r-hz">–</b><small>Hz</small></div>
</div>
<p class="link" id="link"><span class="dot"></span><span id="link-text">connecting…</span></p>

<div id="live"></div>

<details>
  <summary>Requires a restart</summary>
  <div id="static"></div>
  <button id="restart">Restart the bridge</button>
</details>

<div id="toast"></div>

<script>
"use strict";

const $ = (id) => document.getElementById(id);
const built = new Map();       // key -> {input, value, toggle}
let dragging = null;           // key being dragged, so polling can't fight the thumb
const holding = new Set();     // keys with a finger still on them
/* Keys with a change queued or a POST in flight. paint() must not repaint
   these: the server has not been told yet, or has not answered, so its state is
   stale by definition and would flick the control back for a frame. Sliders
   were covered by `dragging`; switches and checkboxes had nothing, so roughly a
   third of taps visibly bounced. */
const inFlight = new Set();
/* Last value the server reported for a dial that is currently switched off.
   Without it, ticking "enabled" posts whatever the browser parked the slider
   at -- for SPRINT_AT that is the midpoint of 20..600, so one tap would have
   silently set sprint to ~310 W. */
const lastGood = new Map();

function toast(message, isError) {
  const el = $("toast");
  el.textContent = message;
  el.className = "show" + (isError ? " err" : "");
  clearTimeout(toast.timer);
  toast.timer = setTimeout(() => { el.className = ""; }, isError ? 6000 : 2600);
}

/* Render a dial's number the way config.env spells it, so what you read here
   is what you would have typed into the file. */
function show(dial, value) {
  if (value === null || value === undefined) return "off";
  const decimals = dial.step < 1 ? (String(dial.step).split(".")[1] || "").length : 0;
  return value.toFixed(decimals) + (dial.unit ? " " + dial.unit : "");
}

function buildDial(dial) {
  const box = document.createElement("div");
  box.className = "dial";

  const head = document.createElement("header");
  const name = document.createElement("span");
  name.className = "name";
  name.textContent = dial.label;
  const value = document.createElement("span");
  value.className = "val";
  head.append(name, value);
  box.append(head);

  /* A bool is a switch, not a slider. Rendered as a range it became a
     two-position track with a blank label -- unreadable as an on/off state. */
  const input = document.createElement("input");
  if (dial.kind === "bool") {
    input.type = "checkbox";
    input.className = "switch";
  } else {
    input.type = "range";
    input.min = dial.min; input.max = dial.max; input.step = dial.step;
  }
  box.append(input);

  /* Two dials are not just a number. SPRINT_AT can be off entirely, and
     FROZEN_AFTER has a disabled value (0) that sits outside its own range --
     a slider alone cannot express either, so they get a checkbox. */
  let toggle = null;
  if (dial.nullable || dial.disabled_value !== null) {
    const row = document.createElement("div");
    row.className = "toggle";
    toggle = document.createElement("input");
    toggle.type = "checkbox";
    toggle.id = "en-" + dial.key;
    const label = document.createElement("label");
    label.htmlFor = toggle.id;
    label.textContent = "enabled";
    row.append(toggle, label);
    box.append(row);
  }

  if (dial.help) {
    const help = document.createElement("p");
    help.textContent = dial.help;
    box.append(help);
  }

  let note = null;
  if (!dial.live) {
    note = document.createElement("p");
    note.className = "note";
    box.append(note);
  }

  const entry = { dial, input, value, toggle, note };
  built.set(dial.key, entry);

  if (dial.kind === "bool") {
    input.addEventListener("change", () => {
      value.textContent = input.checked ? "on" : "off";
      queue(dial.key);
    });
  } else {
    /* Fires continuously while dragging: update the label every frame so it
       tracks the thumb, but debounce the POST so a swipe is a handful of
       requests rather than a hundred. The Pi is also polling BLE and any
       cost here is telemetry rate the rider feels. */
    input.addEventListener("input", () => {
      value.textContent = show(dial, Number(input.value));
      value.className = "val";
      dragging = dial.key;
      queue(dial.key);
    });
    /* Every way a drag can end, including the ones that are not a clean
       release: an interrupted touch (an incoming call) would otherwise leave
       `dragging` latched and that dial frozen out of every repaint for the
       rest of the session. */
    input.addEventListener("pointerdown", () => { holding.add(dial.key); });
    const settle = () => {
      holding.delete(dial.key);
      if (dragging === dial.key) dragging = null;
    };
    for (const event of ["change", "pointerup", "pointercancel",
                         "touchend", "touchcancel", "blur"]) {
      input.addEventListener(event, settle);
    }
  }

  if (toggle) {
    toggle.addEventListener("change", () => {
      input.disabled = !toggle.checked;
      /* Update the readout here, not on the next poll: enabling engages the
         dial immediately, and a header still reading "off" for half a second
         is the page disagreeing with the bike. */
      const now = currentValue(dial.key);
      value.textContent = now === null ? "off" : show(dial, Number(now));
      value.className = now === null ? "val off" : "val";
      queue(dial.key);
    });
  }
  return box;
}

function currentValue(key) {
  const { dial, input, toggle } = built.get(key);
  if (dial.kind === "bool") return input.checked;
  if (toggle && !toggle.checked) {
    return dial.nullable ? null : dial.disabled_value;
  }
  return Number(input.value);
}

const pending = new Map();
let sendTimer = null;
function queue(key) {
  pending.set(key, currentValue(key));
  inFlight.add(key);
  if (sendTimer) return;
  sendTimer = setTimeout(send, 150);
}

async function send() {
  sendTimer = null;
  if (!pending.size) return;
  const payload = Object.fromEntries(pending);
  pending.clear();
  const sent = Object.keys(payload);
  /* Released only once the server has answered, so the next poll paints from
     a state that already includes this change. */
  const done = () => { for (const key of sent) inFlight.delete(key); };
  try {
    const response = await fetch("/api/config", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify(payload),
    });
    const data = await response.json();
    if (!response.ok) {
      done();
      toast(data.error || ("HTTP " + response.status), true);
      /* The bridge refused it, so the running value is NOT what the slider
         shows -- but do NOT snap it back while a finger is still down. The
         most reachable rejection is an ordinary tuning move (dragging
         MOVEMENT_MIN above MOVEMENT_MAX rejects every POST), and yanking the
         thumb out from under the finger at 7 Hz makes the control unusable.
         Once released, the 500 ms poll resyncs it on its own. */
      if (holding.size === 0) {
        dragging = null;
        refresh();
      }
      return;
    }
    if (data.warning) toast(data.warning, true);
    else if (data.restart_required && data.restart_required.length) {
      toast(data.restart_required.join(", ") + " — restart to apply");
    }
  } catch (err) {
    toast("could not reach the bridge: " + err.message, true);
  } finally {
    done();
  }
}

/* A restart-required dial has two values: what it is set to, and what the
   bridge is actually running. Showing only one of them is how this control
   managed to lie in both directions across two review rounds -- first claiming
   the file's value was in force, then snapping the rider's own edit back to the
   startup value while saving it anyway. Say both. */
function pendingNote(entry, dial) {
  if (!entry.note) return;
  const running = dial.running;
  if (running === null || running === undefined || running === dial.value) {
    entry.note.textContent = dial.live ? "" : "in force";
    entry.note.className = "note";
    return;
  }
  const shown = dial.kind === "bool"
    ? (running ? "on" : "off") : show(dial, running);
  entry.note.textContent = `running ${shown} — restart to apply`;
  entry.note.className = "note pending";
}

function paint(state) {
  for (const dial of state.dials) {
    const entry = built.get(dial.key);
    if (!entry) continue;
    /* Never yank a control the rider is still working: one under a thumb, or
       one whose change the server has not answered yet. */
    if (dragging === dial.key || inFlight.has(dial.key)) continue;

    if (dial.kind === "bool") {
      entry.input.disabled = dial.value === null;
      if (dial.value !== null) entry.input.checked = !!dial.value;
      entry.value.textContent = dial.value === null
        ? "not set" : (dial.value ? "on" : "off");
      entry.value.className = dial.value ? "val" : "val off";
      pendingNote(entry, dial);
      continue;
    }

    /* A restart-required dial whose value config.env does not carry: say so
       rather than let the slider park at the midpoint of its own range and
       read as if that were the running value. */
    if (dial.value === null && !dial.nullable) {
      entry.value.textContent = "not set";
      entry.value.className = "val off";
      /* Disabled, not merely unlabelled. An <input type=range> with no value
         parks at the midpoint of its span, so this would otherwise show a
         thumb near 500 Hz for a bridge running at 60 -- and one tap on the
         track would save it. */
      entry.input.disabled = true;
      continue;
    }
    entry.input.disabled = false;
    const off = dial.value === null || dial.value === dial.disabled_value;
    if (entry.toggle) {
      entry.toggle.checked = !off;
      entry.input.disabled = off;
    }
    if (off) {
      /* Keep the slider parked somewhere meaningful while it is off, so
         enabling it posts that rather than a browser default. */
      entry.input.value = lastGood.has(dial.key) ? lastGood.get(dial.key) : dial.min;
    } else {
      entry.input.value = dial.value;
      lastGood.set(dial.key, dial.value);
    }
    entry.value.textContent = off ? "off" : show(dial, dial.value);
    entry.value.className = off ? "val off" : "val";
    pendingNote(entry, dial);
  }

  const s = state.status;
  $("r-power").textContent = s.power;
  $("r-cadence").textContent = s.cadence.toFixed(0);
  $("r-move").textContent = s.move.toFixed(2);
  $("r-hz").textContent = s.hz.toFixed(1);
  $("uptime").textContent = "· up " + Math.floor(s.uptime / 60) + "m";

  const link = $("link");
  const connected = s.bike === "connected" || s.bike === "simulated";
  link.className = "link " + (s.frozen ? "bad" : connected ? "ok" : "");
  let text = "bike " + s.bike;
  if (s.age !== null) text += " · " + s.age.toFixed(1) + "s ago";
  if (s.frozen) text += " · FROZEN";
  if (s.sprint) text += " · SPRINT";
  text += " · " + (s.controller === "none" ? "no controller" : s.controller);
  $("link-text").textContent = text;
}

let firstPaint = true;
let refreshing = false;
async function refresh() {
  /* One at a time. refresh() awaits before it checks firstPaint, so a first
     fetch slower than the 500 ms poll -- a phone that just joined wifi, or a
     Pi mid-BLE-connect -- let two calls both build the whole dial list. The
     second set won `built`, so dragging a visible slider from the first set
     posted the OTHER copy's stale value. */
  if (refreshing) return;
  refreshing = true;
  try {
    const state = await (await fetch("/api/state")).json();
    if (firstPaint) {
      for (const dial of state.dials) {
        (dial.live ? $("live") : $("static")).append(buildDial(dial));
      }
      firstPaint = false;
    }
    paint(state);
  } catch (err) {
    $("link").className = "link bad";
    $("link-text").textContent = "no connection to the bridge";
  } finally {
    refreshing = false;
  }
}

$("restart").addEventListener("click", async () => {
  if (!confirm("Restart the bridge? The BLE link and the virtual pad drop for "
             + "a few seconds — don't do this mid-game.")) return;
  try {
    /* Content-Type is not decoration here: the server requires
       application/json on POST, which is what stops a cross-site form from
       reaching this endpoint. */
    const response = await fetch("/api/restart", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: "{}",
    });
    const data = await response.json();
    toast(response.ok ? "restarting…" : (data.error || "restart failed"), !response.ok);
  } catch (err) {
    toast("restart request failed: " + err.message, true);
  }
});

refresh();
setInterval(refresh, 500);
</script>
</body>
</html>
